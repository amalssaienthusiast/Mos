name: Build Mos

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Mos
        run: |
          xcodebuild \
            -project Mos.xcodeproj \
            -scheme Debug \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Zip app artifact
        run: |
          mkdir -p ./dist
          ditto -c -k --keepParent "./build/Build/Products/Debug/Mos Debug.app" "./dist/Mos-Debug.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mos-Debug
          path: ./dist/Mos-Debug.zip
          retention-days: 14
